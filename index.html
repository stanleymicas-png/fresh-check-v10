<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Check - v11</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#fde7f0;color:#222}
.tabs{display:flex;background:#fff2f6;padding:10px;gap:8px;position:sticky;top:0;z-index:10}
.tabs button{flex:1;padding:12px;border:none;border-radius:20px;font-size:16px;font-weight:bold;cursor:pointer;background:#eee}
.tabs button.active{background:#ec407a;color:white}
.container{padding:14px;max-width:520px;margin:auto}
.card{background:white;border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,0.08)}
h1{text-align:center;font-size:32px;margin:6px 0}
.sub{text-align:center;color:#666;margin:0 0 16px}
label{font-weight:bold;display:block;margin:14px 0 6px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}
.btn{width:100%;border:none;padding:14px;border-radius:12px;font-size:18px;font-weight:bold;margin-top:12px;cursor:pointer;color:white}
.btn-pink{background:#ec407a}
.btn-purple{background:#5e35b1}
.btn-green{background:#81c784;color:#1b5e20}
.locBox{background:#dcf2d9;border:1px solid #a5d6a7;padding:12px;border-radius:12px;margin-top:14px}
.locTitle{font-weight:bold;color:#1b5e20}
.locLine{font-size:17px;margin-top:4px;color:#1b5e20}
.locSmall{font-size:12px;color:#555;margin-top:4px}
.switch-item{border-bottom:1px solid #eee;padding:10px 0}
.fresh{color:#2e7d32;font-weight:bold}
.expired{color:#c62828;font-weight:bold}
.warn{color:#ef6c00;font-weight:bold}
.small{font-size:13px;color:#666}
</style>
</head>
<body>

<div class="tabs">
  <button id="tabCheck" class="active" onclick="showTab('check')">Fresh Check</button>
  <button id="tabSwitch" onclick="showTab('switch')">My Switchboard</button>
</div>

<div class="container">
<div id="pageCheck">
<div class="card">
<h1>🥦 Fresh Check</h1>
<p class="sub">Check if your food is still fresh!</p>

<label>Product Name</label>
<input id="productName" placeholder="e.g. Milk, Bread, Chicken">

<button class="btn btn-pink" onclick="scanBarcode()">Scan Barcode</button>

<label>Barcode Number</label>
<input id="barcode" placeholder="e.g. 6001234567890" inputmode="numeric">

<button class="btn btn-purple" onclick="lookupProduct()">🔍 Look Up Product Name</button>

<label>Expiry Date on Packet</label>
<input type="date" id="expiry">

<div class="locBox">
<div class="locTitle">📍 Location (GPS Auto-Detect)</div>
<div class="locLine" id="gpsText">Detecting automatically...</div>
<div class="locSmall">Detecting automatically in background - township language.</div>
</div>

<button class="btn btn-pink" onclick="checkFreshness()">Check Freshness ✅</button>
<div id="result" style="margin-top:14px;font-size:18px"></div>
</div>
</div>

<div id="pageSwitch" style="display:none">
<div class="card">
<h3>Live Switchboard</h3>
<p class="small">All checks from this device.</p>
<div id="switchList">No checks yet.</div>
<button class="btn btn-pink" onclick="clearSwitch()">Clear Switchboard</button>
</div>
</div>

<p class="small" style="text-align:center">Fresh Check v11 - GPS Only - Township Language</p>
</div>

<script>
let currentLocation = "Detecting automatically...";
function showTab(which){
  document.getElementById('pageCheck').style.display = which==='check'?'block':'none';
  document.getElementById('pageSwitch').style.display = which==='switch'?'block':'none';
  document.getElementById('tabCheck').className = which==='check'?'active':'';
  document.getElementById('tabSwitch').className = which==='switch'?'active':'';
  if(which==='switch') renderSwitch();
}
function cleanTownshipName(text){
  if(!text) return text;
  // Remove municipality language - keep only township language
  let banned = ["municipality","Municipality","eThekwini","City of","Metropolitan","District","Local Municipality"];
  let cleaned = text;
  banned.forEach(b=>{ cleaned = cleaned.split(b).join(""); });
  cleaned = cleaned.replace(/, ,/g,", ").replace(/\s+/g," ").trim().replace(/^,|,$/g,"");
  return cleaned || text;
}
function getGPS(){
  if(!navigator.geolocation){ document.getElementById('gpsText').innerText="GPS not supported"; return; }
  navigator.geolocation.getCurrentPosition(async function(pos){
    let lat = pos.coords.latitude, lng = pos.coords.longitude;
    // Try to get township name in background, single line only
    try{
      let res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=14&addressdetails=1`);
      let data = await res.json();
      let a = data.address || {};
      let place = a.suburb || a.neighbourhood || a.township || a.village || a.town || a.city_district || "";
      let area = a.suburb && a.neighbourhood && a.neighbourhood!==a.suburb ? a.neighbourhood : "";
      let single = place ? (area ? place + ", " + area : place) : "Current Location";
      single = cleanTownshipName(single);
      currentLocation = single;
      document.getElementById('gpsText').innerText = single;
    }catch(e){
      currentLocation = "Lat: " + lat.toFixed(4) + ", Lng: " + lng.toFixed(4);
      document.getElementById('gpsText').innerText = currentLocation;
    }
  }, function(){ document.getElementById('gpsText').innerText="Please allow location permission"; });
}
getGPS();
function scanBarcode(){ alert("Point camera at barcode, then type the number you see."); document.getElementById('barcode').focus(); }
function lookupProduct(){
  let code = document.getElementById('barcode').value.trim();
  if(!code){ alert("Please enter barcode number first"); return; }
  alert("Looking up product for barcode: " + code + ". If not found, please type product name.");
}
function checkFreshness(){
  let name = document.getElementById('productName').value.trim() || "Unknown Product";
  let barcode = document.getElementById('barcode').value.trim() || "No barcode";
  let expiryVal = document.getElementById('expiry').value;
  if(!expiryVal){ alert("Please pick expiry date"); return; }
  let today = new Date(); today.setHours(0,0,0,0);
  let exp = new Date(expiryVal);
  let diff = Math.round((exp - today)/(1000*60*60*24));
  let status="", cls="";
  if(diff<0){ status="EXPIRED - Do not sell / Do not eat"; cls="expired"; }
  else if(diff===0){ status="EXPIRES TODAY - Use with caution"; cls="warn"; }
  else if(diff<=3){ status="EXPIRING SOON - " + diff + " days left"; cls="warn"; }
  else{ status="FRESH - " + diff + " days left"; cls="fresh"; }
  document.getElementById('result').innerHTML = "<div class='"+cls+"'>"+status+"</div><div class='small'>"+name+" | "+currentLocation+"</div>";
  let checks = JSON.parse(localStorage.getItem('fresh_checks')||"[]");
  checks.unshift({name:name,barcode:barcode,expiry:expiryVal,status:status,location:currentLocation,time:new Date().toLocaleString()});
  localStorage.setItem('fresh_checks', JSON.stringify(checks));
}
function renderSwitch(){
  let checks = JSON.parse(localStorage.getItem('fresh_checks')||"[]");
  if(checks.length===0){ document.getElementById('switchList').innerHTML="No checks yet."; return; }
  document.getElementById('switchList').innerHTML = checks.map(c=>"<div class='switch-item'><b>"+c.name+"</b><br>"+c.status+"<br><span class='small'>"+c.time+" | "+c.location+" | Barcode: "+c.barcode+"</span></div>").join("");
}
function clearSwitch(){ localStorage.removeItem('fresh_checks'); renderSwitch(); }
</script>
</body>
</html>
